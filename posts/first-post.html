<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的第一篇博客 - 我的博客</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <!-- 导航栏 -->
    <header>
        <nav>
            <div class="logo">
                <h1><a href="../index.html">我的博客</a></h1>
            </div>
            <ul class="nav-links">
                <li><a href="../index.html">首页</a></li>
                <li><a href="../about.html">关于</a></li>
            </ul>
        </nav>
    </header>

    <!-- 主内容区 -->
    <main>
        <article class="post-detail">
            <h2 id="post-title"></h2>
            <p class="post-meta" id="post-meta"></p>
            <div class="post-content" id="post-content"></div>
        </article>
    </main>

    <!-- 页脚 -->
    <footer>
        <p>&copy; 2024 我的博客. All rights reserved.</p>
    </footer>

    <script src="../js/main.js"></script>
    <script>
        // 加载并解析markdown文件
        fetch('first-post.md')
            .then(response => response.text())
            .then(text => {
                // 解析markdown内容
                const lines = text.split('\n');
                
                // 获取标题（第一行）
                const title = lines[0].replace('# ', '');
                document.getElementById('post-title').textContent = title;
                
                // 获取元数据（第三行）
                const meta = lines[2];
                document.getElementById('post-meta').textContent = meta;
                
                // 获取正文内容（从第五行开始）
                const content = lines.slice(4).join('\n');
                
                // 使用marked.js将markdown转换为HTML
                const html = marked.parse(content);
                document.getElementById('post-content').innerHTML = html;
            })
            .catch(error => {
                console.error('加载markdown文件失败:', error);
                document.getElementById('post-content').innerHTML = '<p>加载文章内容失败</p>';
            });
    </script>
</body>
</html>
