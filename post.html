<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文章 — 深度睡眠</title>
  <meta name="description" content="博客文章">
  <meta name="theme-color" content="#0c1411">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script>if(localStorage.getItem('theme')==='light')document.documentElement.setAttribute('data-theme','light');</script>
</head>
<body>

  <div id="starry-sky" aria-hidden="true"></div>

  <!-- ===== Navigation ===== -->
  <header class="site-header">
    <div class="header-inner">
      <div class="header-left">
        <div class="site-title"><a href="index.html">深度睡眠</a></div>
      </div>
      <div class="header-center">
        <nav>
          <ul class="nav-links">
            <li><a href="index.html">首页</a></li>
            <li><a href="about.html">关于</a></li>
            <li><a href="archive.html">归档</a></li>
          </ul>
        </nav>
      </div>
      <div class="header-right">
        <button class="menu-toggle" aria-label="Toggle menu">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <!-- ===== Reading Progress ===== -->
  <div class="progress-bar"></div>

  <!-- ===== Post Content ===== -->
  <div class="page-wrap about-page">
    <main>
      <article>
        <header class="post-header" id="post-header">
          <!-- Populated by main.js -->
        </header>

        <div class="post-content" id="post-content">
          <!-- Rendered by main.js from Markdown -->
        </div>

        <nav class="post-nav" id="post-nav">
          <!-- Prev/Next populated by main.js -->
        </nav>
      </article>
    </main>

    <aside class="sidebar">
      <div class="sidebar-widget about-widget">
        <h3>关于</h3>
        <div class="avatar"><img src="/images/header.jpg" alt="M"></div>
        <p>写作者 &amp; 开发者。写代码、设计，和生活里安静的事。</p>
        <div class="social-links">
          <a href="#">GitHub</a>
          <a href="#">Twitter</a>
          <a href="#">RSS</a>
        </div>
      </div>

      <div class="sidebar-widget">
        <h3>分类</h3>
        <ul class="category-list" id="sidebar-categories">
          <li class="loading-placeholder">加载中...</li>
        </ul>
      </div>

      <div class="sidebar-widget">
        <h3>最新文章</h3>
        <ul class="recent-posts-list" id="sidebar-recent">
          <li class="loading-placeholder">加载中...</li>
        </ul>
      </div>

      <div class="sidebar-widget">
        <h3>标签</h3>
        <div class="tag-cloud" id="sidebar-tags">
          <span class="loading-placeholder">加载中...</span>
        </div>
      </div>
    </aside>
  </div>

  <!-- ===== Footer ===== -->
  <footer class="site-footer">
    <p>&copy; 2026 <a href="index.html">深度睡眠</a>。保留所有权利。</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
