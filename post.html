<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>博客文章 - 我的博客</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <!-- 导航栏 -->
    <header>
        <nav>
            <div class="logo">
                <h1><a href="index.html">我的博客</a></h1>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">首页</a></li>
                <li><a href="about.html">关于</a></li>
            </ul>
        </nav>
    </header>

    <!-- 主内容区 -->
    <main>
        <article class="post-detail">
            <h2 id="post-title">加载中...</h2>
            <p class="post-meta" id="post-meta"></p>
            <div class="post-content" id="post-content">
                <p>正在加载文章内容...</p>
            </div>
        </article>
    </main>

    <!-- 页脚 -->
    <footer>
        <p>&copy; 2024 我的博客. All rights reserved.</p>
    </footer>

    <script src="js/main.js"></script>
    <script>
        // 获取URL参数
        function getUrlParam(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        // 加载并解析markdown文件
        const slug = getUrlParam('slug');
        if (slug) {
            fetch(`posts/${slug}.md`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('文章不存在');
                    }
                    return response.text();
                })
                .then(text => {
                    // 解析markdown内容
                    const lines = text.split('\n');
                    
                    // 获取标题（第一行）
                    const title = lines[0].replace('# ', '');
                    document.getElementById('post-title').textContent = title;
                    document.title = title + ' - 我的博客';
                    
                    // 获取元数据（第三行）
                    const meta = lines[2];
                    document.getElementById('post-meta').textContent = meta;
                    
                    // 获取正文内容（从第五行开始）
                    const content = lines.slice(4).join('\n');
                    
                    // 使用marked.js将markdown转换为HTML
                    const html = marked.parse(content);
                    document.getElementById('post-content').innerHTML = html;
                })
                .catch(error => {
                    console.error('加载markdown文件失败:', error);
                    document.getElementById('post-title').textContent = '文章不存在';
                    document.getElementById('post-content').innerHTML = '<p>抱歉，您请求的文章不存在或已被删除。</p>';
                });
        } else {
            document.getElementById('post-title').textContent = '缺少文章参数';
            document.getElementById('post-content').innerHTML = '<p>抱歉，无法加载文章，缺少必要的参数。</p>';
        }
    </script>
</body>
</html>
