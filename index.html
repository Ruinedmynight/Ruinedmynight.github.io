<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的博客</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <!-- 导航栏 -->
    <header>
        <nav>
            <div class="logo">
                <h1><a href="index.html">我的博客</a></h1>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">首页</a></li>
                <li><a href="about.html">关于</a></li>
            </ul>
        </nav>
    </header>

    <!-- 主内容区 -->
    <main>
        <section class="hero">
            <h2>欢迎来到我的博客</h2>
            <p>记录生活，分享知识</p>
        </section>

        <!-- 博客文章列表 -->
        <section class="posts" id="posts-container"></section>
    </main>

    <!-- 页脚 -->
    <footer>
        <p>&copy; 2024 我的博客. All rights reserved.</p>
    </footer>

    <script src="js/main.js"></script>
    <script>
        // 文章列表数据
        const posts = [
            { slug: 'first-post', filename: 'posts/first-post.md' }
        ];

        // 生成文章卡片
        function generatePostCard(post) {
            fetch(post.filename)
                .then(response => response.text())
                .then(text => {
                    const lines = text.split('\n');
                    
                    // 提取标题
                    const title = lines[0].replace('# ', '');
                    
                    // 提取元数据
                    const meta = lines[2];
                    
                    // 提取摘要（前100个字符）
                    let content = lines.slice(4).join('\n');
                    // 移除markdown标记获取纯文本
                    const plainText = content.replace(/#+\s/g, '')
                                            .replace(/\*\*(.*?)\*\*/g, '$1')
                                            .replace(/\*(.*?)\*/g, '$1')
                                            .replace(/\[(.*?)\]\((.*?)\)/g, '$1')
                                            .replace(/\n/g, ' ');
                    const excerpt = plainText.substring(0, 100) + '...';
                    
                    // 创建文章卡片
                    const postCard = document.createElement('article');
                    postCard.className = 'post-card';
                    postCard.innerHTML = `
                        <h3><a href="posts/${post.slug}.html">${title}</a></h3>
                        <p class="post-meta">${meta}</p>
                        <p>${excerpt}</p>
                        <a href="posts/${post.slug}.html" class="read-more">阅读更多</a>
                    `;
                    
                    // 添加到页面
                    document.getElementById('posts-container').appendChild(postCard);
                })
                .catch(error => {
                    console.error('加载文章失败:', error);
                });
        }

        // 加载所有文章
        posts.forEach(post => {
            generatePostCard(post);
        });
    </script>
</body>
</html>
